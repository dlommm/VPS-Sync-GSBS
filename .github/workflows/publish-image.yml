name: Publish image

# Builds the publisher image and pushes it to GHCR so a VPS only ever pulls.
#
# GSBS is a build-time dependency cloned inside the Dockerfile, so a GSBS change
# does not trigger this workflow. Use the manual run (or the weekly schedule) to
# pick up a new GSBS main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gsbs_ref:
        description: "GSBS ref to build against"
        default: main
        required: false
  # Rebuild weekly so the image tracks GSBS main and picks up base-image
  # security updates even in a quiet week.
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GSBS_REF=${{ inputs.gsbs_ref || 'main' }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull one of the tags that were actually pushed rather than recomputing
      # one: metadata-action's short-sha format need not match `git rev-parse
      # --short`, and guessing wrong fails the job on a good image.
      - name: Smoke-test the pushed image
        run: |
          tag="$(head -n1 <<<'${{ steps.meta.outputs.tags }}')"
          echo "Smoke-testing $tag"
          docker run --rm "$tag" version
