name: Publish image

# Builds the publisher image and pushes it to Docker Hub so a VPS only ever pulls.
#
# Every run cuts a new release: scripts/next-version.sh picks the next semver
# from the commits since the last vX.Y.Z tag (feat: -> minor, feat!: or
# BREAKING CHANGE -> major, anything else -> patch). The image is pushed as
# both X.Y.Z and latest, and only after that succeeds is the commit tagged
# vX.Y.Z and a GitHub release created.
#
# GSBS is a build-time dependency cloned inside the Dockerfile, so a GSBS change
# does not trigger this workflow. Use the manual run (or the weekly schedule) to
# pick up a new GSBS main; those runs are patch releases.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto reads the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      gsbs_ref:
        description: "GSBS ref to build against"
        default: main
        required: false
  # Rebuild weekly so the image tracks GSBS main and picks up base-image
  # security updates even in a quiet week.
  schedule:
    - cron: "0 6 * * 1"

# Two runs computing a version at once would both pick the same number.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE_NAME: dendlomm/vps-sync-gsbs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag and create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the version calculation

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          version="$(scripts/next-version.sh)"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GSBS_REF=${{ inputs.gsbs_ref || 'main' }}
            VERSION=v${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          tag="${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          got="$(docker run --rm "$tag" version)"
          echo "$tag reports $got"
          [[ "$got" == "v${{ steps.version.outputs.version }}" ]]

      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes \
            --notes "Docker image: \`${IMAGE_NAME}:${VERSION#v}\` (also \`latest\`)"
